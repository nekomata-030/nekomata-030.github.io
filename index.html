<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOTH 商品資料自動填表器</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">🛒 BOOTH 商品自動填表器</h1>
        
        <div class="flex gap-2 mb-6">
            <input type="text" id="boothUrl" placeholder="請貼上 BOOTH 商品連結 (e.g., https://booth.pm/ja/items/xxxx)" 
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="fetchBoothData()" id="submitBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition-colors duration-200">
                自動抓取
            </button>
        </div>

        <div id="errorMsg" class="text-red-500 text-sm mb-4 hidden"></div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 border border-gray-200 rounded-lg">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-1/2">商品名稱</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-1/4">價格</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-1/4">連結</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody" class="bg-white divide-y divide-gray-200">
                    <tr id="emptyRow">
                        <td colspan="3" class="px-6 py-8 text-center text-gray-400">目前尚無資料，請在上方輸入連結</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchBoothData() {
            const urlInput = document.getElementById('boothUrl');
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            const tableBody = document.getElementById('itemTableBody');
            const emptyRow = document.getElementById('emptyRow');
            
            const url = urlInput.value.trim();
            
            // 驗證是否為 BOOTH 網址
            if (!url.includes('booth.pm')) {
                showError('請輸入正確的 BOOTH 商品網址！');
                return;
            }

            // 初始化狀態
            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = '抓取中...';

            try {
                // 使用 allorigins 免費代理服務繞過 CORS 限制
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error('網路連線失敗');
                
                const data = await response.json();
                
                // 解析回傳的 HTML 網頁內容
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');

                // --- 核心解析邏輯 ---
                // BOOTH 的商品名稱通常在 <h2> 且帶有頁面標題屬性，或者特定的 class
                const titleElement = doc.querySelector('h2.item-name') || doc.querySelector('.u-text-wrap');
                // 價格通常在 .price 或者有 itemprop="price" 的標籤
                const priceElement = doc.querySelector('.price') || doc.querySelector('[itemprop="price"]');

                if (!titleElement) {
                    throw new Error('無法解析商品名稱，可能網頁結構有變或非商品頁。');
                }

                const title = titleElement.innerText.trim();
                const price = priceElement ? priceElement.innerText.trim() : '未偵測到價格';

                // 移除「目前尚無資料」的欄位
                if (emptyRow) emptyRow.remove();

                // 建立新的表格列 (Row)
                const newRow = document.createElement('tr');
                newRow.className = 'hover:bg-gray-50 transition-colors';
                newRow.innerHTML = `
                    <td class="px-6 py-4 text-sm font-medium text-gray-900">${title}</td>
                    <td class="px-6 py-4 text-sm text-red-600 font-bold">${price}</td>
                    <td class="px-6 py-4 text-sm text-blue-500">
                        <a href="${url}" target="_blank" class="hover:underline">商品連結</a>
                    </td>
                `;

                // 插入到表格最前面
                tableBody.insertBefore(newRow, tableBody.firstChild);
                
                // 清空輸入框
                urlInput.value = '';

            } catch (error) {
                console.error(error);
                showError(`抓取失敗：${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerText = '自動抓取';
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = message;
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
